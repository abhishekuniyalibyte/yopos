<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOPOS AI Assistant — Demo</title>
<style>
  :root {
    --bg: #f6f6f4;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6b66;
    --line: #e2e2dd;
    --accent: #c8452f;
    --accent-ink: #ffffff;
    --bot-bg: #f0f0ec;
    --warn-bg: #fdf3e7;
    --warn-line: #e8c9a0;
    --warn-ink: #8a5a1a;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
  }

  /* ---- fake storefront behind the widget, so the demo reads like a website ---- */
  .site { max-width: 1000px; margin: 0 auto; padding: 32px 20px 120px; }
  .site h1 { font-size: 26px; margin: 0 0 4px; }
  .site .sub { color: var(--muted); margin: 0 0 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 14px; }
  .card .nm { font-weight: 600; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .card .pr { margin-top: 7px; font-variant-numeric: tabular-nums; }

  /* ---- floating button + panel, per brief lines 14-18 ---- */
  #ask {
    position: fixed; right: 22px; bottom: 22px; z-index: 30;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 999px; padding: 13px 21px;
    font: inherit; font-weight: 600; cursor: pointer;
    box-shadow: 0 5px 18px rgba(0,0,0,.2);
  }
  #panel {
    position: fixed; top: 0; right: 0; z-index: 40;
    width: 400px; max-width: 100vw; height: 100vh;
    background: var(--panel); border-left: 1px solid var(--line);
    display: none; flex-direction: column;
    box-shadow: -6px 0 26px rgba(0,0,0,.12);
  }
  #panel.open { display: flex; }
  .head { padding: 13px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .head .t { font-weight: 600; flex: 1; }
  .head button { background: none; border: 0; font-size: 21px; cursor: pointer; color: var(--muted); line-height: 1; }

  .settings { padding: 11px 15px; border-bottom: 1px solid var(--line); background: #fafaf8; font-size: 13px; }
  .settings input[type=password] {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 7px; font: inherit; font-size: 13px; margin-top: 5px;
  }
  .settings label.row { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; cursor: pointer; }
  .settings label.row input { margin-top: 3px; flex-shrink: 0; }
  .settings .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .mode-warn {
    display: none; margin-top: 9px; padding: 8px 10px; font-size: 12px; line-height: 1.45;
    background: var(--warn-bg); border: 1px solid var(--warn-line);
    border-radius: 7px; color: var(--warn-ink);
  }
  .mode-warn.on { display: block; }

  #log { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 11px; }
  .msg { max-width: 86%; padding: 9px 12px; border-radius: var(--radius); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot { background: var(--bot-bg); align-self: flex-start; border-bottom-left-radius: 3px; }
  .msg.me  { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 3px; }
  .msg.sys { align-self: center; text-align: center; color: var(--muted); font-size: 12.5px; background: none; padding: 2px 0; }
  .msg.err { background: #fdecea; color: #8d2b1c; align-self: flex-start; font-size: 13px; }
  .tool {
    align-self: flex-start; font-size: 12px; color: var(--muted);
    border-left: 2px solid var(--line); padding: 1px 0 1px 9px; white-space: pre-wrap;
  }

  .cart { border-top: 1px solid var(--line); padding: 10px 15px; font-size: 13px; background: #fafaf8; }
  .cart .ln { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .cart .ln .x { color: var(--muted); cursor: pointer; }
  .cart .tot { display: flex; justify-content: space-between; font-weight: 600; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; }
  .cart .empty { color: var(--muted); }

  .composer { display: flex; gap: 8px; padding: 11px 15px; border-top: 1px solid var(--line); }
  .composer input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; font: inherit; }
  .composer button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 9px; padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .composer button:disabled { opacity: .5; cursor: default; }

  @media (max-width: 460px) { #panel { width: 100vw; } }
</style>
</head>
<body>

<div class="site">
  <h1 id="storeName">Loading…</h1>
  <p class="sub" id="storeSub"></p>
  <div class="grid" id="grid"></div>
</div>

<button id="ask">Ask AI</button>

<div id="panel">
  <div class="head">
    <span class="t">Ask AI</span>
    <button id="close" title="Close">×</button>
  </div>

  <div class="settings">
    <label for="key">Anthropic API key <span class="hint">(stays in this browser tab)</span></label>
    <input id="key" type="password" placeholder="sk-ant-…" autocomplete="off">

    <label class="row">
      <input type="checkbox" id="guess">
      <span>
        <strong>Let the AI infer nutrition</strong>
        <span class="hint" id="modeHint">Off — the bot says it has no nutrition data.</span>
      </span>
    </label>

    <div class="mode-warn" id="modeWarn">
      The menu has no calorie, protein or ingredient data — <code>item_kcal</code> is null on all
      137 items. With this on, every nutrition claim below is the model guessing from the item
      name. Shown so the difference is visible; not safe to ship.
    </div>
  </div>

  <div id="log"></div>

  <div class="cart" id="cart"></div>

  <form class="composer" id="composer" autocomplete="off">
    <input id="input" placeholder="Try: what's good for dinner under £8?">
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
const API_URL = "https://api.anthropic.com/v1/messages";
const MODEL = "claude-sonnet-5";

let MENU = null;      // menu_clean.json, as generated by clean_menu.py
let BY_ID = new Map();
let cart = [];        // demo cart: in memory only, no backend to write to
let history = [];

const $ = id => document.getElementById(id);
const money = n => "£" + Number(n).toFixed(2);

/* ---------------------------------------------------------------------------
   Load the cleaned menu. This is fetched rather than inlined so that re-running
   clean_menu.py updates the demo with no edit here.
--------------------------------------------------------------------------- */
fetch("menu_clean.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(m => {
    MENU = m;
    m.items.forEach(i => BY_ID.set(i.item_id, i));
    renderStore();
    say("bot", `Hi! I can help you find something from the ${m.store.name} menu and add it to your cart. What are you after?`);
  })
  .catch(() => {
    $("grid").innerHTML = '<p style="color:#8d2b1c">Could not load menu_clean.json. '
      + 'Open this page over a local server (see the note at the end of demo.html), not as a file:// URL.</p>';
  });

function renderStore() {
  const s = MENU.store;
  $("storeName").textContent = s.name;
  $("storeSub").textContent = `${s.address} · ${MENU.item_count} items · ready in ${s.cook_time}`;
  $("grid").innerHTML = MENU.items.slice(0, 12).map(i => `
    <div class="card">
      <div class="nm">${esc(i.name)}</div>
      <div class="meta">${esc(i.category)}${i.needs_customisation ? " · choices required" : ""}</div>
      <div class="pr">${money(i.price)}</div>
    </div>`).join("");
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));

/* ---------------------------------------------------------------------------
   Tools. The model picks arguments; this code validates every id against the
   menu before it touches the cart, so a hallucinated item or a skipped required
   choice fails loudly instead of landing in the order.
--------------------------------------------------------------------------- */
const TOOLS = [
  {
    name: "search_menu",
    description: "Search the menu by name, category, meal time or price. Returns matching items with their ids, prices and any required choices.",
    input_schema: {
      type: "object",
      properties: {
        query:     { type: "string", description: "Text to match against item names, e.g. 'chicken'" },
        category:  { type: "string", enum: [] },
        meal_time: { type: "string", enum: ["breakfast", "lunch", "dinner"] },
        max_price: { type: "number" }
      }
    }
  },
  {
    name: "add_to_cart",
    description: "Add an item to the cart. If the item has required choices you MUST supply one option_id for each required step_id; call search_menu first to see them.",
    input_schema: {
      type: "object",
      properties: {
        item_id:  { type: "integer" },
        quantity: { type: "integer", default: 1 },
        choices: {
          type: "array",
          description: "One entry per required step",
          items: {
            type: "object",
            properties: { step_id: { type: "integer" }, option_id: { type: "integer" } },
            required: ["step_id", "option_id"]
          }
        }
      },
      required: ["item_id"]
    }
  },
  { name: "view_cart", description: "Show the current cart contents and total.", input_schema: { type: "object", properties: {} } },
  {
    name: "remove_from_cart",
    description: "Remove a line from the cart by its line number, as shown by view_cart.",
    input_schema: { type: "object", properties: { line: { type: "integer" } }, required: ["line"] }
  }
];

function runTool(name, input) {
  if (name === "search_menu")      return searchMenu(input);
  if (name === "add_to_cart")      return addToCart(input);
  if (name === "view_cart")        return cartState();
  if (name === "remove_from_cart") return removeLine(input);
  return { error: "unknown tool" };
}

function searchMenu({ query, category, meal_time, max_price }) {
  let out = MENU.items;
  if (query)     { const q = query.toLowerCase(); out = out.filter(i => i.name.toLowerCase().includes(q)); }
  if (category)  out = out.filter(i => i.category.toLowerCase() === String(category).toLowerCase());
  if (meal_time) out = out.filter(i => (i.meal_times || []).includes(meal_time));
  if (max_price != null) out = out.filter(i => i.price <= max_price);

  return {
    count: out.length,
    items: out.slice(0, 25).map(i => ({
      item_id: i.item_id, name: i.name, category: i.category, price: i.price,
      meal_times: i.meal_times,
      required_choices: (i.steps || []).filter(s => s.required).map(s => ({
        step_id: s.step_id, label: s.label,
        options: s.options.map(o => ({ option_id: o.option_id, name: o.name }))
      }))
    }))
  };
}

function addToCart({ item_id, quantity = 1, choices = [] }) {
  const item = BY_ID.get(item_id);
  if (!item) return { error: `No item with id ${item_id}. Use search_menu to find a real item_id.` };

  const required = (item.steps || []).filter(s => s.required);
  const picked = [];

  for (const step of required) {
    const choice = choices.find(c => c.step_id === step.step_id);
    if (!choice) {
      return {
        error: `"${item.name}" needs a ${step.label} before it can be added.`,
        missing_step: { step_id: step.step_id, label: step.label,
          options: step.options.map(o => ({ option_id: o.option_id, name: o.name })) }
      };
    }
    const opt = step.options.find(o => o.option_id === choice.option_id);
    if (!opt) return { error: `option_id ${choice.option_id} is not valid for step ${step.step_id} ("${step.label}").` };
    picked.push({ step_id: step.step_id, label: step.label, option_id: opt.option_id, name: opt.name, extra: opt.extra_price || 0 });
  }

  const qty = Math.max(1, Number(quantity) || 1);
  const unit = item.price + picked.reduce((s, p) => s + p.extra, 0);
  cart.push({ item_id, name: item.name, qty, unit, choices: picked });
  renderCart();

  return { added: item.name, quantity: qty, unit_price: unit,
           choices: picked.map(p => `${p.label}: ${p.name}`), cart_total: total() };
}

function removeLine({ line }) {
  const i = Number(line) - 1;
  if (!cart[i]) return { error: `No line ${line}. The cart has ${cart.length} line(s).` };
  const [gone] = cart.splice(i, 1);
  renderCart();
  return { removed: gone.name, cart_total: total() };
}

const total = () => cart.reduce((s, l) => s + l.unit * l.qty, 0);
const cartState = () => ({
  lines: cart.map((l, n) => ({ line: n + 1, name: l.name, quantity: l.qty, unit_price: l.unit,
                               choices: l.choices.map(c => `${c.label}: ${c.name}`) })),
  total: total()
});

function renderCart() {
  const el = $("cart");
  if (!cart.length) { el.innerHTML = '<div class="empty">Cart is empty</div>'; return; }
  el.innerHTML = cart.map((l, n) => `
    <div class="ln">
      <span>${l.qty}× ${esc(l.name)}${l.choices.length ? `<br><span style="color:var(--muted)">${esc(l.choices.map(c => c.name).join(", "))}</span>` : ""}</span>
      <span>${money(l.unit * l.qty)} <span class="x" data-i="${n}" title="Remove">×</span></span>
    </div>`).join("")
    + `<div class="tot"><span>Total</span><span>${money(total())}</span></div>`;
  el.querySelectorAll(".x").forEach(x => x.onclick = () => {
    cart.splice(Number(x.dataset.i), 1); renderCart();
  });
}

/* ---------------------------------------------------------------------------
   System prompt. The whole menu goes in — ~20k tokens for 135 items, which fits
   comfortably, so there is no retrieval step. The nutrition rule is the part
   the toggle swaps.
--------------------------------------------------------------------------- */
function systemPrompt() {
  const s = MENU.store;
  const hours = Object.entries(s.opening_hours).map(([d, h]) => `${d}: ${h}`).join("; ");

  const honest = `NUTRITION AND ALLERGENS — STRICT
This menu has NO calorie, protein, carbohydrate, fat, allergen or ingredient data.
Never state or imply any of it. Never call an item healthy, light, low-carb or high-protein.
If asked, say you do not have that information and suggest checking with the restaurant —
then offer what you DO know (category, price, what is in the item's name) so the customer
can still decide. Never guess from an item's name.`;

  const guessing = `NUTRITION — DEMO MODE (UNSAFE, FOR COMPARISON ONLY)
You may estimate nutrition from item names when asked. State that figures are rough
estimates. NOTE: this mode exists only to show what fabricated nutrition claims look like;
the underlying menu has no nutrition data at all.`;

  return `You are the ordering assistant for ${s.name}, a takeaway in ${s.postcode}.

STORE
Address: ${s.address}. Phone: ${s.phone}. Food ready in about ${s.cook_time}.
Opening hours — ${hours}. Delivery within ${s.delivery_radius_miles} miles.
All prices are in ${s.currency}.

YOUR JOB
Help customers find food and add it to their cart. Be brief and warm — two or three
sentences, no bullet lists unless showing several items. Always give prices.

RULES
- Only ever mention items returned by search_menu. Never invent an item, price or id.
- ${MENU.items.filter(i => i.needs_customisation).length} of ${MENU.item_count} items need required choices (sauce, salad, drink).
  Ask the customer naturally — "which sauce would you like?" — and never guess on their behalf.
- Confirm what you added and the new total after each add_to_cart.
- This demo stops at the cart: you cannot take payment or place the order.
- If asked about something off-menu, say so plainly rather than improvising.

${$("guess").checked ? guessing : honest}

MENU (${MENU.item_count} items)
${JSON.stringify(MENU.items)}`;
}

/* ------------------------------- chat loop ------------------------------- */
function say(who, text) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}
function note(text) {
  const d = document.createElement("div");
  d.className = "tool";
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

async function callClaude(key) {
  TOOLS[0].input_schema.properties.category.enum = MENU.categories;

  const res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      // Demo-only: a key in the browser is never acceptable in production.
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 1024,
      system: [{ type: "text", text: systemPrompt(), cache_control: { type: "ephemeral" } }],
      tools: TOOLS,
      messages: history
    })
  });

  if (!res.ok) throw new Error(`${res.status} ${(await res.text()).slice(0, 300)}`);
  return res.json();
}

async function turn(key) {
  // Loop while the model keeps asking for tools; each result goes back as a user turn.
  for (let hop = 0; hop < 6; hop++) {
    const reply = await callClaude(key);
    history.push({ role: "assistant", content: reply.content });

    for (const block of reply.content) {
      if (block.type === "text" && block.text.trim()) say("bot", block.text);
    }

    const calls = reply.content.filter(b => b.type === "tool_use");
    if (!calls.length) return;

    const results = calls.map(c => {
      const out = runTool(c.name, c.input || {});
      note(`${c.name}(${JSON.stringify(c.input)})${out.error ? " → " + out.error : ""}`);
      return { type: "tool_result", tool_use_id: c.id, content: JSON.stringify(out) };
    });
    history.push({ role: "user", content: results });
  }
  say("err", "Stopped after too many tool calls.");
}

$("composer").addEventListener("submit", async e => {
  e.preventDefault();
  const key = $("key").value.trim();
  const text = $("input").value.trim();
  if (!text) return;
  if (!key)  { say("err", "Paste an Anthropic API key above to run the demo."); return; }
  if (!MENU) { say("err", "Menu has not loaded yet."); return; }

  say("me", text);
  history.push({ role: "user", content: text });
  $("input").value = "";
  $("send").disabled = true;

  try { await turn(key); }
  catch (err) { say("err", "API error: " + err.message); }
  finally { $("send").disabled = false; $("input").focus(); }
});

/* ------------------------------ UI plumbing ------------------------------ */
$("ask").onclick   = () => { $("panel").classList.add("open"); $("input").focus(); };
$("close").onclick = () => $("panel").classList.remove("open");

$("guess").onchange = e => {
  const on = e.target.checked;
  $("modeWarn").classList.toggle("on", on);
  $("modeHint").textContent = on
    ? "On — the bot guesses nutrition from item names."
    : "Off — the bot says it has no nutrition data.";
  history = [];
  say("sys", on
    ? "— switched to inferring nutrition · conversation reset —"
    : "— switched to no-nutrition-claims · conversation reset —");
};

renderCart();
</script>

<!--
  RUNNING THIS
    The page fetches menu_clean.json from the same folder, which a file:// URL blocks.
    From this directory run:   python3 -m http.server 8000
    then open:                 http://localhost:8000/demo.html

  SCOPE
    Demo only. The cart lives in memory — there is no YOPOS backend to write to, which
    is what the brief asks for. The real integration is one function: replace the cart
    array with calls to the live cart API once its payload shape is known.

    The API key is entered in the browser, which is fine for a local demo and never
    acceptable in production. In production the Anthropic call moves to a small backend
    endpoint so the key is never exposed.
-->
</body>
</html>
